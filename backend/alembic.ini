# Only needed for running Alembic by hand, e.g. to create a new migration:
#
#   .venv/bin/alembic revision --autogenerate -m "describe the change"
#
# The application applies migrations itself at start-up.
[alembic]
script_location = src/levet/adapters/db/migrations
file_template = %%(rev)s_%%(slug)s
