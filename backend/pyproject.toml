[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "levet"
version = "0.1.0"
description = "Self-hosted exam-practice web app"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20",
    "fastapi>=0.162",
    "fsrs>=6.3",
    "itsdangerous>=2.2",
    "pymupdf>=2.1",
    "python-multipart>=0.0.33",
    "sqlalchemy>=2.1",
    "uvicorn[standard]>=0.54",
]

[project.optional-dependencies]
dev = ["httpx2>=2.16", "pytest>=9", "ruff>=0.17"]

[tool.hatch.build.targets.wheel]
packages = ["src/levet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# Word lists read better as one split string than as a list of quoted words.
ignore = ["SIM905"]
